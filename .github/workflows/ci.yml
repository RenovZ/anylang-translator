name: CI

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - '.editorconfig'
      - '.gitignore'
      - '.prettier*'
      - '.tokeignore'
  pull_request:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - '.editorconfig'
      - '.gitignore'
      - '.prettier*'
      - '.tokeignore'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality Check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm check

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

  build:
    name: Build (${{ matrix.browser }})
    runs-on: ubuntu-latest
    needs: quality
    strategy:
      matrix:
        browser: [chrome, firefox, safari, opera, edge]
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and zip for ${{ matrix.browser }}
        run: pnpm zip:${{ matrix.browser }}

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: anylang-translator-${{ matrix.browser }}
          path: .output/*.zip
          if-no-files-found: error
